# Production stack for a shared Linux server where a host-level nginx already owns ports 80/443
# (pool.novulabs.net). nginx terminates TLS and forwards:  /api/* -> 127.0.0.1:8040,  everything else -> 127.0.0.1:3040.
# Deployed automatically by .github/workflows/deploy.yml. See docs/CICD.md.
name: pool

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      BEHIND_TLS_PROXY: "True"
    volumes:
      - copilot_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8040:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request as u;
          r=u.Request('http://127.0.0.1:8000/api/v1/health/',headers={'Host':os.environ['ALLOWED_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'});
          u.urlopen(r,timeout=4)
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s

  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api/v1/
        VITE_DEMO_MODE: ${DEMO_MODE:-false}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:3040:80"
    depends_on:
      - backend

volumes:
  db_data:
  copilot_data:
